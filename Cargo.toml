[workspace]
members = [".", "gui", "image_store", "ffi_gen", "win_gui", "winui_host"]
# WINARM (WG5b-2): `winui_host` joins - the Windows GUI's host service, a
# cdylib over `image_store::flows` reached through the FFI's new `library:`
# part. It is a NON-default member like every GUI-side crate here, so a bare
# `cargo build`/`cargo test` at the top is unchanged; build it explicitly
# with `cargo build -p winui_host`, which drops `winui_host.dll` beside
# `win_gui.exe` where `LoadLibraryA` finds it.
# WINARM (WG1): `win_gui` joins — the Windows-native Smalltalk UI's host
# (`macvm-winui`, docs/win_gui_design.md §2/§3 row WG1). It is a NON-default
# member like every GUI in this tree, so a bare `cargo build`/`cargo test` at
# the top still builds and tests `macvm` alone and never links a window; build
# it explicitly with `cargo build -p win_gui`. Its only dependencies are
# `macvm` itself and the same `windows` 0.62 `gui` already pins, so nothing
# here changes what the default members resolve to.
# WINARM (P4 D1): `gui` has rejoined — its shell seam now exists (`gui/src/
# shell/`: Win32 + WebView2 on Windows, Cocoa/WKWebView on macOS —
# MIGRATION.md §2). `cocoa_gui` and `abc_player` are AppKit / AVFoundation and
# stay out until Win32 counterparts exist, if ever.
#
# What made P0 drop it still holds and is why the MacGamePane dependencies are
# no longer DECLARED anywhere: a cargo path dependency's manifest must be
# READABLE for the workspace to resolve AT ALL, even when optional and
# target-gated, so `gui`'s old MacGamePane path deps failed workspace
# resolution before any cfg was consulted. They now live behind the
# off-by-default `gamepane` feature, with the restore instructions in
# `gui/Cargo.toml` — declaring them again would re-break the whole workspace,
# not just `gui`.
#
# WINARM (P4) corrects P0's diagnosis in passing: MacGamePane is NOT missing
# from this machine. It is checked out at `WINARM/MacGamePane/`; the old deps
# pointed at `../../MacGamePane` (= `C:\projects\MacGamePane`), which is one
# level too high. It stays out regardless because it is Metal/AppKit and so
# macOS-only — see `gui/Cargo.toml`'s `gamepane` feature for the full note.
#
# `default-members` still lists only the root package, so a bare `cargo build`
# / `cargo test` at the top builds and tests `macvm` alone; the gui is built
# and tested explicitly with `-p macvm-gui`.
# Per gui/PLAN.md §6 (SPEC A18): the repo root is a cargo workspace once GUI
# implementation starts, root package included as a member (not just a
# virtual manifest) so `cargo build`/`test` at the top still builds macvm
# alone by default.
#
# `cocoa_gui` (docs/cocoa_gui_design.md §12, sprint CG2) is the native AppKit
# GUI bin (`macvm-cocoa`), a NON-default member: `default-members` lists only
# the root package, so a bare `cargo build`/`cargo test` at the top builds/tests
# macvm alone and never links the AppKit glue. Build it explicitly with
# `cargo build -p cocoa_gui`.
default-members = ["."]
resolver = "2"

[package]
name = "macvm"
version = "1.0.0"
edition = "2021"
description = "A Self/Strongtalk-lineage adaptive research VM for macOS on Apple Silicon (arm64)."
license = "BSD-2-Clause"
publish = false
# A second [[bin]] (asm_preview, S23) makes a bare `cargo run` ambiguous —
# every Justfile recipe and doc that says `cargo run -- run …` means the VM.
default-run = "macvm"

[[bin]]
name = "macvm"
path = "src/main.rs"

# S23 (docs/ASM.md) preview tool: extracts a `<asm: '...'>` method body and
# runs it through the vendored JASM assembler (src/vendor/wfasm), standing
# alone from the real compiler pipeline — see docs/ASM.md §7.
[[bin]]
name = "asm_preview"
path = "src/bin/asm_preview.rs"

[lib]
name = "macvm"
path = "src/lib.rs"

[build-dependencies]
# Compiles the one Objective-C file the Cocoa bridge needs (the @try/@catch
# exception shim, src/runtime/objc_shim.m) — "the one new build dependency
# this design admits" (docs/cocoa_bridge_design.md §5).
cc = "1"

[dependencies]
libc = "0.2"
# Vendored wfasm (S9, src/vendor/wfasm/) uses anyhow for its own error
# plumbing (Result/Context/bail!) — kept as-is per the vendoring procedure's
# "minimal diff against upstream" rule rather than re-threaded onto MACVM's
# own error types.
anyhow = "1"
# codecache::guard::JitWriteGuard's flush-range list (sprint_s09_detail.md
# D2.4) — almost always 1-2 entries per publish/patch, so the inline
# capacity avoids a heap allocation on the common path.
smallvec = "1"

# WINARM (P5, MIGRATION.md §3.5): the `winkb` FFI resolver's SQLite driver,
# Windows-only (`src/runtime/winkb.rs` — the knowledge base replacing
# macOS's `cocoa_data`). `bundled` compiles sqlite3 with the proven C
# toolchain rather than depending on a system library — same pin WINVM
# carries. Deliberately deferred from P0 (zero-dependency interpreter
# bring-up); lands here with its one consumer. The DATABASE itself
# (`windows_api.db`, ~90 MB) is a machine-local artifact, never a build
# input: absence is not an error (`WinkbError::DbMissing` → pragma
# fallback), and the suite must stay green without it.
[target.'cfg(windows)'.dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }

# Codegen backend is an OPEN DECISION (see docs/DESIGN.md §4). Backends are
# selected by feature so the compiler front end never hard-depends on one.
[features]
default = []
# backend-jasm = []   # reuse the JASM AArch64 encoder
# backend-llvm = []   # emit LLVM IR
# interp-only  = []   # baseline interpreter, no native codegen

# Cocoa C3's main-thread-hop gate needs the REAL main thread (libtest runs
# #[test]s on workers while main sits in join(), so nothing would drain the
# main dispatch queue). harness = false makes main() the test.
[[test]]
name = "cocoa_main_hop"
harness = false

# Cocoa C6 reverse-dispatch gate (CG3): harness = false so main() is the real
# main thread — the UI worker boots in place on main (the CG2 arrangement),
# publishes its *mut VmHandle, and delegate IMPs dispatch as top-level entries
# there; a forced SIGSEGV in a handler recovers via that thread's sigsetjmp,
# which isolating the test to its own process keeps from taking other tests down.
[[test]]
name = "cocoa_delegate"
harness = false

[profile.release]
opt-level = 3
lto = "thin"
